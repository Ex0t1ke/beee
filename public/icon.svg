<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#48bb78" />
      <stop offset="100%" stopColor="#2f855a" />
    </linearGradient>
    <radialGradient id="woolGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="70%" stopColor="#f8fafc" />
      <stop offset="100%" stopColor="#e2e8f0" />
    </radialGradient>
    <radialGradient id="faceGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#475569" />
      <stop offset="100%" stopColor="#1e293b" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background circle/squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner glowing circle -->
  <circle cx="256" cy="256" r="220" fill="#ffffff" opacity="0.1" />

  <!-- Shadow under sheep -->
  <ellipse cx="256" cy="400" rx="140" ry="32" fill="#1b4d3e" opacity="0.4" />

  <g filter="url(#shadow)">
    <!-- Legs -->
    <rect x="180" y="320" width="28" height="70" rx="14" fill="#1e293b" />
    <rect x="304" y="320" width="28" height="70" rx="14" fill="#1e293b" />
    <rect x="140" y="310" width="26" height="70" rx="13" fill="#334155" />
    <rect x="346" y="310" width="26" height="70" rx="13" fill="#334155" />

    <!-- Tail -->
    <circle cx="120" cy="270" r="28" fill="url(#woolGrad)" stroke="#cbd5e1" stroke-width="4" />

    <!-- Wool Puffs Body -->
    <circle cx="160" cy="230" r="54" fill="url(#woolGrad)" />
    <circle cx="210" cy="180" r="58" fill="url(#woolGrad)" />
    <circle cx="280" cy="170" r="60" fill="url(#woolGrad)" />
    <circle cx="340" cy="200" r="56" fill="url(#woolGrad)" />
    <circle cx="360" cy="260" r="54" fill="url(#woolGrad)" />
    <circle cx="320" cy="310" r="56" fill="url(#woolGrad)" />
    <circle cx="240" cy="320" r="58" fill="url(#woolGrad)" />
    <circle cx="170" cy="290" r="54" fill="url(#woolGrad)" />
    <ellipse cx="256" cy="250" rx="105" ry="80" fill="url(#woolGrad)" />

    <!-- Head & Face -->
    <g transform="translate(256, 175)">
      <!-- Left Ear -->
      <path d="M -15,10 C -55,8 -65,42 -35,46 C -15,48 -5,25 -15,10 Z" fill="#334155" stroke="#1e293b" stroke-width="3" />
      <path d="M -18,15 C -45,15 -50,38 -30,40 C -15,40 -10,25 -18,15 Z" fill="#f472b6" opacity="0.6" />

      <!-- Right Ear -->
      <path d="M 15,10 C 55,8 65,42 35,46 C 15,48 5,25 15,10 Z" fill="#334155" stroke="#1e293b" stroke-width="3" />
      <path d="M 18,15 C 45,15 50,38 30,40 C 15,40 10,25 18,15 Z" fill="#f472b6" opacity="0.6" />

      <!-- Face -->
      <ellipse cx="0" cy="30" rx="46" ry="50" fill="url(#faceGrad)" />

      <!-- Rosy Cheeks -->
      <circle cx="-28" cy="45" r="11" fill="#fb7185" opacity="0.6" />
      <circle cx="28" cy="45" r="11" fill="#fb7185" opacity="0.6" />

      <!-- Eyes (curious, happy) -->
      <ellipse cx="-16" cy="24" rx="8" ry="10" fill="#ffffff" />
      <ellipse cx="-16" cy="24" rx="5.5" ry="7.5" fill="#0f172a" />
      <circle cx="-18" cy="21" r="2.8" fill="#ffffff" />

      <ellipse cx="16" cy="24" rx="8" ry="10" fill="#ffffff" />
      <ellipse cx="16" cy="24" rx="5.5" ry="7.5" fill="#0f172a" />
      <circle cx="14" cy="21" r="2.8" fill="#ffffff" />

      <!-- Nose & Smile -->
      <path d="M -6,48 Q 0,54 6,48 Q 0,43 -6,48 Z" fill="#f472b6" />
      <path d="M -8,58 Q 0,65 8,58" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />

      <!-- Forehead Wool Curls -->
      <circle cx="-22" cy="-12" r="18" fill="url(#woolGrad)" />
      <circle cx="0" cy="-18" r="21" fill="url(#woolGrad)" />
      <circle cx="22" cy="-12" r="18" fill="url(#woolGrad)" />
    </g>

    <!-- Golden Bell on ribbon -->
    <path d="M 230,285 Q 256,298 282,285" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
    <path d="M 246,290 L 243,306 L 269,306 L 266,290 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <circle cx="256" cy="308" r="4" fill="#ca8a04" />
  </g>

  <!-- Sparkles -->
  <g fill="#fde047">
    <path d="M 390,90 Q 390,115 415,115 Q 390,115 390,140 Q 390,115 365,115 Q 390,115 390,90 Z" />
    <path d="M 110,130 Q 110,145 125,145 Q 110,145 110,160 Q 110,145 95,145 Q 110,145 110,130 Z" />
  </g>
</svg>
