name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Initialize Capacitor 6 Android
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          # Bump versionCode to 3 and versionName to 1.2.0 for smooth APK update
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/versionCode 1/versionCode 3/g' android/app/build.gradle || true
            sed -i 's/versionName "1.0"/versionName "1.2.0"/g' android/app/build.gradle || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for easy download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SheepClicker-v1.2.0.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SheepClicker-v1.2.0-apk
          path: SheepClicker-v1.2.0.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Sheep Clicker v1.2.0
          tag_name: ${{ github.ref_name || 'v1.2.0' }}
          files: SheepClicker-v1.2.0.apk
          draft: false
          prerelease: false
          body: |
            ## 🐑 Sheep Clicker v1.2.0 Update!
            
            ### ✨ Новые возможности:
            - **Золотое Возрождение (Prestige)**: дерево вечных талантов за Золотые Рога (📯).
            - **Интерактивная защита от волка**: кликайте по крадущемуся волку, спасайте овец и получайте горы шерсти!
            - **Динамическая погода (Weather Engine)**: солнце, радуга (x2 шерсть), дождичек и ветерок.
            - **Ежедневные квесты**: выполняйте задания и забирайте ценные призы.
            - **Офлайн-прогресс и дельта-тайм 120Hz+**: максимальная плавность без фризов.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
